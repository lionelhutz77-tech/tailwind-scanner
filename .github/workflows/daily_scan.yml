name: Daily Tailwind Scan

on:
  schedule:
    # 5 Versuche pro Tag (06-10 UTC = 08-12 Uhr DE) — einer davon wird GitHub zuverlaessig ausfuehren
    # Doppel-Run-Schutz im scanner.py verhindert mehrfachen Scan am selben Tag
    - cron: "0 6 * * 1-5"
    - cron: "0 7 * * 1-5"
    - cron: "0 8 * * 1-5"
    - cron: "0 9 * * 1-5"
    - cron: "0 10 * * 1-5"
  workflow_dispatch:  # Manuell startbar per Knopf auf GitHub

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Abhaengigkeiten installieren
        run: pip install -r requirements.txt

      - name: Scanner ausfuehren
        run: python scanner.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}

      - name: Report committen
        run: |
          git config user.name  "Tailwind Scanner Bot"
          git config user.email "bot@tailwind-scanner"
          git add reports/
          git diff --cached --quiet || git commit -m "Report $(date +'%Y-%m-%d')"
          git pull --rebase
          git push
