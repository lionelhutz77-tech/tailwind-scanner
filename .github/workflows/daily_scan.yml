name: Daily Tailwind Scan

on:
  schedule:
    # Jeden Werktag um 08:00 Uhr deutscher Zeit (= 06:00 UTC im Sommer)
    # Zweiter Versuch um 09:00 Uhr falls GitHub den ersten verzögert (= 07:00 UTC)
    - cron: "0 6 * * 1-5"
    - cron: "0 7 * * 1-5"
  workflow_dispatch:  # Manuell startbar per Knopf auf GitHub

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Abhaengigkeiten installieren
        run: pip install -r requirements.txt

      - name: Scanner ausfuehren
        run: python scanner.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}

      - name: Report committen
        run: |
          git config user.name  "Tailwind Scanner Bot"
          git config user.email "bot@tailwind-scanner"
          git add reports/
          git diff --cached --quiet || git commit -m "Report $(date +'%Y-%m-%d')"
          git push
